receivers:
  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 60s
    endpoint: "https://${env:K8S_NODE_IP}:10250"
    insecure_skip_verify: true
    metric_groups: [node, pod, container, volume]
    metrics:
      k8s.pod.network.io:
        enabled: true
      k8s.pod.network.errors:
        enabled: true
      # Monotonic cumulative sum — DT rejects it; disable at source.
      k8s.node.cpu.time:
        enabled: false
    extra_metadata_labels:
      - k8s.volume.type

  # Scrapes kubelet's cAdvisor endpoint for CPU throttling metrics not
  # available via the stats/summary API used by kubeletstats.
  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scheme: https
          scrape_interval: 60s
          tls_config:
            insecure_skip_verify: true
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          static_configs:
            - targets: ["${env:K8S_NODE_IP}:10250"]
          metrics_path: /metrics/cadvisor
          metric_relabel_configs:
            # Keep only CPU throttling counters and CPU usage.
            - source_labels: [__name__]
              regex: 'container_cpu_cfs_(throttled_seconds|throttled_periods|periods)_total|container_cpu_usage_seconds_total'
              action: keep
            # Drop empty container names (node-level cgroup rows) and the POD sandbox.
            - source_labels: [container]
              regex: '^$|^POD$'
              action: drop
            # No _total stripping here. These names keep their Prometheus _total
            # suffix and therefore arrive as Sum[monotonic]; the cumulativetodelta
            # processor in the metrics/cadvisor pipeline converts them to delta,
            # which Dynatrace accepts. See that processor for the full reasoning.

processors:
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s

  # Enriches kubeletstats metrics with pod/workload metadata from K8s API.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.replicaset.name
        - k8s.job.name
        - k8s.cronjob.name
        - k8s.namespace.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      # Static pods: transform/static_pod_uid drops the kubelet's config-hash UID,
      # so fall back to name+namespace and let k8s.pod.uid be filled with the
      # mirror pod's API UID (the one the topology pull and k8s_cluster use).
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name

  # kubeletstats reports static pods (e.g. kube-proxy) under the kubelet's internal
  # UID — the 32-hex config hash — not the API UID. Smartscape pod/container IDs
  # hash k8s.pod.uid, so those data points would point at entities that don't exist.
  transform/static_pod_uid:
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "k8s.pod.uid") where attributes["k8s.pod.uid"] != nil and IsMatch(attributes["k8s.pod.uid"], "^[0-9a-f]{32}$")

  transform/workload_dims:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
          - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
          - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
          - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.deployment.name"] != nil
          - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.name"] == nil
          - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.kind"] == nil
          - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.name"] == nil
          - set(attributes["k8s.workload.kind"], "cronjob") where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.kind"] == nil
          - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.name"] == nil
          - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.kind"] == nil
          - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.job.name"] != nil and attributes["k8s.workload.name"] == nil
          - set(attributes["k8s.workload.kind"], "job") where attributes["k8s.job.name"] != nil and attributes["k8s.workload.kind"] == nil
          - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.name"] == nil
          - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.kind"] == nil

  # Normalises cAdvisor Prometheus label names to OTel k8s.* semantic
  # conventions and renames metrics to dot-separated keys.
  transform/cadvisor:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
          - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
          - set(attributes["k8s.node.name"], "${env:K8S_NODE_NAME}")
      - context: datapoint
        statements:
          - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
          - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
          - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
          - delete_key(attributes, "namespace")
          - delete_key(attributes, "pod")
          - delete_key(attributes, "container")
          - delete_key(attributes, "image")
          - delete_key(attributes, "id")
          - delete_key(attributes, "job")
          - delete_key(attributes, "instance")
      - context: metric
        statements:
          # Names arrive with the Prometheus _total suffix intact. The receiver's
          # trim_metric_suffixes option defaults to false (prometheusreceiver
          # v0.153.0 appendable.go/metricfamily.go), so nothing normalises the
          # suffix away once the relabel-based strip is gone. Confirmed against
          # the debug exporter on this cluster.
          - set(name, "container.cpu.cfs.throttled.time")    where name == "container_cpu_cfs_throttled_seconds_total"
          - set(name, "container.cpu.cfs.throttled.periods") where name == "container_cpu_cfs_throttled_periods_total"
          - set(name, "container.cpu.cfs.periods")           where name == "container_cpu_cfs_periods_total"
          - set(name, "container.cpu.usage.cadvisor")        where name == "container_cpu_usage_seconds_total"

  # Dynatrace's OTLP metrics endpoint silently drops Sum[monotonic] (cumulative
  # counter) metrics: no error is raised anywhere, the data simply never lands in
  # Grail. Converting them to delta temporality makes them ingestible.
  # Confirmed empirically on this tenant -- over a 2h window the Gauge
  # k8s.pod.cpu.usage arrived (58 pts) while its Sum[monotonic] twin
  # k8s.pod.cpu.time, plus k8s.pod.network.io, k8s.pod.network.errors and
  # container.cpu.time, were entirely absent. config/host.yaml already relies on
  # this processor, and its monotonic sums (system.cpu.time, process.cpu.time) do
  # arrive.
  #
  # Used by metrics/cadvisor too. That pipeline used to dodge the drop by
  # stripping the _total suffix in metric_relabel_configs, which makes the
  # Prometheus receiver emit Gauge instead of Sum[monotonic]. That Gauge still
  # carried a cumulative value, and nothing downstream can difference it, so
  # consumers could only compute lifetime averages -- container.cpu_throttled in
  # the legacy ActiveGate module is a windowed percentage (3-98% live), while the
  # stripped Gauges could only yield a flat lifetime 1.74% on this cluster. Delta
  # conversion gives per-interval values, so the ratio is windowed and
  # comparable. A single processor definition is enough: the collector
  # instantiates processors per pipeline, so the two pipelines keep independent
  # delta state despite sharing this config block.
  #
  # Non-monotonic sums and gauges are passed through untouched, so this is a
  # no-op for every other metric in this pipeline.
  #
  # max_staleness is deliberately far shorter than host.yaml's 25h. host.yaml
  # needs 25h because it has a 1h-interval hostmetrics scraper whose state must
  # survive gaps > 1h. kubeletstats scrapes every 60s and its series are pod- and
  # container-scoped, so 25h would pin per-series state for every pod that has
  # since been deleted -- unbounded growth against the 256 MiB memory_limiter.
  # 5m tolerates ~4 missed scrapes, which is all this interval needs. cAdvisor
  # scrapes at the same 60s interval with the same container-scoped churn, so
  # the same 5m applies there.
  cumulativetodelta:
    max_staleness: 5m

  batch:
    timeout: 10s
    send_batch_size: 1000

exporters:
  otlphttp:
    endpoint: "${env:DT_ENDPOINT}"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

  debug:
    verbosity: basic

service:
  pipelines:
    metrics/kubeletstats:
      receivers: [kubeletstats]
      processors: [memory_limiter, transform/static_pod_uid, k8sattributes, transform/workload_dims, cumulativetodelta, batch]
      exporters: [otlphttp, debug]
    metrics/cadvisor:
      receivers: [prometheus/cadvisor]
      processors: [memory_limiter, transform/cadvisor, cumulativetodelta, batch]
      exporters: [otlphttp, debug]
